<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDT4250 Website:)</title>
    <link href="./style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="header">
      <img src="./images/instalogo.png" alt="instalogo" id="logo" />
      <input type="text" placeholder="Search" id="searchBar" />
      <p><a href="https://www.instagram.com">Home</a></p>
    </div>
    <div class="info">
      <img
        src="images/uka_offisiell.jpg"
        alt="profile picture"
        id="profilePic"
      />
      <div id="userinfo">
        <div id="usernameFields">
          <p id="username">uka_offisiell</p>
          <button id="followButton" onclick="followUser('uka_offisiell')">
            Follow
          </button>
        </div>
        <div id="userStats">
          <p>1 posts</p>
          <p>2 followers</p>
          <p>0 following</p>
        </div>
        <div class="description">
          <p id="realName">UKA</p>
          <p id="descriptionText">
            Norges stoerste kultirfestival :bang: www.uka.no/
          </p>
        </div>
      </div>
    </div>
    <div class="posts">
      <div class="post">
        <img
          src="images/post1.jpg"
          alt="thumbnail for post"
          class="thumbnail"
          onClick="openDetailedView('openPostDiv')"
        />
        <div id="cover">
          <p id="coverText">2 Likes 1 Comments</p>
        </div>
      </div>
    </div>
    <div class="footer">
      <p>Contact me</p>
      <a href="mailto:jonatbr@stud.ntnu.no">jonatbr@stud.ntnu.no</a>
    </div>
    <div id="background" onclick="closeOpenPost('x')" />
    <div class="openPostDiv x">
      <img src="images/post1.jpg" alt="post" id="openPostImg" />
      <div id="openPostContent">
        <p id="openPostText">Beskrivelse</p>
        <p id="commentTitle">Comments:</p>
        <div class="comment">
          <p class="username">Username</p>
          <p class="comment">Comment</p>
          <hr />
        </div>
        <div class="comment">
          <p class="username">Username</p>
          <p class="comment">Comment</p>
          <hr />
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
